<!doctype html>
<html lang="en">
  <head>

    <!-- BASIC -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- TITLE -->
    <title>
      DriveEase – Hire Trusted Drivers Online | Safe Driver Booking India
    </title>

    <!-- SEO DESCRIPTION -->
    <meta
      name="description"
      content="DriveEase helps you hire trusted and verified drivers for local, hourly, and outstation trips across India. Safe, reliable, and affordable driver booking platform."
    />

    <!-- KEYWORDS -->
    <meta
      name="keywords"
      content="driver booking, hire driver, personal driver, outstation driver, local driver service, DriveEase, trusted drivers India"
    />

    <!-- AUTHOR -->
    <meta name="author" content="DriveEase" />

    <!-- THEME COLOR -->
    <meta name="theme-color" content="#00ff88" />

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <!-- OPEN GRAPH / SOCIAL SHARE -->
    <meta
      property="og:title"
      content="DriveEase – Hire Trusted Drivers Online"
    />

    <meta
      property="og:description"
      content="Book verified drivers for local and outstation rides anywhere in India."
    />

    <meta
      property="og:image"
      content="/images/favicon.png"
    />

    <meta
      property="og:type"
      content="website"
    />

    <!-- TWITTER -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="DriveEase – Driver Booking Platform India"
    />

    <meta
      name="twitter:description"
      content="Safe and trusted driver booking service across India."
    />

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          })
          .catch(function () {});
      }

      if ('caches' in window) {
        caches.keys()
          .then(function (keys) {
            return Promise.all(keys.filter(function (key) {
              return key.indexOf('driveease-') === 0;
            }).map(function (key) {
              return caches.delete(key);
            }));
          })
          .catch(function () {});
      }
    </script>

  </head>

  <body>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
