        <rect x="372" y="156" width="92" height="40" rx="12" fill="#102743" stroke="#2f86ff"/>
        <text x="418" y="181" text-anchor="middle" class="white" font-size="14" font-weight="900">Review</text>
      </g>

      <g transform="translate(30 462)">
        <text class="white" font-size="19" font-weight="900">Route demand</text>
        <rect y="24" width="488" height="136" rx="16" fill="#0a1322" stroke="#253954"/>
        <text x="20" y="62" class="muted" font-size="14">Airport - City Center</text>
        <rect x="190" y="48" width="214" height="16" rx="8" fill="#17263b"/>
        <rect x="190" y="48" width="182" height="16" rx="8" fill="#05d66f"/>
        <text x="422" y="64" class="white" font-size="14" font-weight="800">86%</text>
        <text x="20" y="102" class="muted" font-size="14">Hotel - Event venue</text>
        <rect x="190" y="88" width="214" height="16" rx="8" fill="#17263b"/>
        <rect x="190" y="88" width="138" height="16" rx="8" fill="#2f86ff"/>
        <text x="422" y="104" class="white" font-size="14" font-weight="800">64%</text>
        <text x="20" y="142" class="muted" font-size="14">Outstation weekend</text>
        <rect x="190" y="128" width="214" height="16" rx="8" fill="#17263b"/>
        <rect x="190" y="128" width="112" height="16" rx="8" fill="#f6c85f"/>
        <text x="422" y="144" class="white" font-size="14" font-weight="800">52%</text>
      </g>

      <g transform="translate(30 646)">
        <rect width="488" height="1" fill="#24364f"/>
        <text x="0" y="28" class="muted" font-size="14">Recommended next step</text>
        <text x="0" y="56" class="white" font-size="19" font-weight="900">Add 2 sedans online before 6 PM</text>
        <rect x="356" y="18" width="132" height="42" rx="13" fill="#2f86ff"/>
        <text x="422" y="44" text-anchor="middle" class="white" font-size="14" font-weight="900">Update fleet</text>
      </g>
    </g>
  </g>
</svg>
