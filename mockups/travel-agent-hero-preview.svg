      <text class="white h1" x="0" y="148">business with</text>
      <text class="green h1" x="0" y="218">verified rides</text>
      <text class="muted" x="0" y="282" font-size="22">See route demand, fleet performance, customer leads,</text>
      <text class="muted" x="0" y="317" font-size="22">and upcoming booking opportunities in one partner view.</text>

      <rect x="0" y="364" width="172" height="58" rx="14" fill="#05d66f"/>
      <text x="86" y="400" text-anchor="middle" fill="#06121f" font-size="17" font-weight="900">View New Leads</text>
      <rect x="192" y="364" width="184" height="58" rx="14" fill="#0a1527" stroke="#4b6078"/>
      <text x="284" y="400" text-anchor="middle" class="white" font-size="17" font-weight="800">Manage Vehicles</text>

      <g transform="translate(0 470)">
        <rect width="164" height="86" rx="16" class="card"/>
        <text x="18" y="36" class="white metric">42</text>
        <text x="18" y="64" class="muted" font-size="14">active enquiries</text>
        <rect x="182" width="164" height="86" rx="16" class="card"/>
        <text x="200" y="36" class="white metric">18</text>
        <text x="200" y="64" class="muted" font-size="14">trending routes</text>
        <rect x="364" width="164" height="86" rx="16" class="card"/>
        <text x="382" y="36" class="white metric">96%</text>
        <text x="382" y="64" class="muted" font-size="14">on-time score</text>
      </g>
