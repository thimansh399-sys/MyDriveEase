      <rect x="1" y="1" width="546" height="72" rx="24" fill="#0c1b2d"/>
      <text x="30" y="45" class="white" font-size="24" font-weight="900">Travel Partner Dashboard</text>
      <rect x="372" y="20" width="142" height="34" rx="17" fill="#0d3a2a" stroke="#1edc83"/>
      <circle cx="392" cy="37" r="5" fill="#05df77"/>
      <text x="452" y="42" text-anchor="middle" class="green" font-size="14" font-weight="800">Live demand</text>

      <g transform="translate(30 96)">
        <rect width="150" height="86" rx="16" fill="#0a1322" stroke="#253954"/>
        <text x="18" y="30" class="muted" font-size="14">Open leads</text>
        <text x="18" y="64" class="white" font-size="32" font-weight="900">24</text>
        <rect x="166" width="150" height="86" rx="16" fill="#0a1322" stroke="#253954"/>
        <text x="184" y="30" class="muted" font-size="14">Vehicles free</text>
        <text x="184" y="64" class="white" font-size="32" font-weight="900">11</text>
        <rect x="332" width="156" height="86" rx="16" fill="#0a1322" stroke="#253954"/>
        <text x="350" y="30" class="muted" font-size="14">Today scope</text>
        <text x="350" y="64" class="white" font-size="30" font-weight="900">₹24k</text>
      </g>

      <g transform="translate(30 206)">
        <text class="white" font-size="19" font-weight="900">New customer requests</text>
        <rect y="24" width="488" height="92" rx="16" fill="#0a1322" stroke="#253954"/>
        <circle cx="34" cy="70" r="18" fill="#e9f2ff"/>
        <text x="34" y="77" text-anchor="middle" fill="#13233c" font-size="15" font-weight="900">AK</text>
        <text x="66" y="62" class="white" font-size="17" font-weight="850">Airport pickup - Indiranagar</text>
        <text x="66" y="88" class="muted" font-size="14">Sedan needed today, 7:30 PM</text>
        <rect x="372" y="50" width="92" height="40" rx="12" fill="#05d66f"/>
        <text x="418" y="75" text-anchor="middle" fill="#06121f" font-size="14" font-weight="900">Accept</text>

        <rect y="130" width="488" height="92" rx="16" fill="#0a1322" stroke="#253954"/>
        <circle cx="34" cy="176" r="18" fill="#d8ffe7"/>
        <text x="34" y="183" text-anchor="middle" fill="#13233c" font-size="15" font-weight="900">RS</text>
        <text x="66" y="168" class="white" font-size="17" font-weight="850">Corporate day package</text>
