<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.48" stop-color="#0c1c31"/>
      <stop offset="1" stop-color="#073424"/>
    </linearGradient>
    <radialGradient id="glowA" cx="40%" cy="44%" r="55%">
      <stop offset="0" stop-color="#05d66f" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#05d66f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="76%" cy="30%" r="55%">
      <stop offset="0" stop-color="#2f86ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2f86ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .muted { fill: #aab6c5; }
      .white { fill: #ffffff; }
      .green { fill: #05df77; }
      .blue { fill: #2f86ff; }
      .panel { fill: #071524; stroke: rgba(38, 238, 142, 0.28); }
      .card { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.14); }
      .small { font-size: 18px; }
      .label { font-size: 17px; font-weight: 700; }
      .h1 { font-size: 68px; font-weight: 900; letter-spacing: 0; }
      .h2 { font-size: 31px; font-weight: 900; }
      .metric { font-size: 28px; font-weight: 900; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#glowA)"/>
  <rect width="1440" height="900" fill="url(#glowB)"/>

  <path d="M850 165 C1000 90 1210 155 1390 70 L1440 70 L1440 900 L748 900 C760 728 735 515 850 165Z" fill="#0b2238" opacity="0.58"/>
  <path d="M760 715 C885 635 1025 724 1140 620 C1246 525 1332 540 1440 455 L1440 900 L710 900Z" fill="#071c29" opacity="0.72"/>

  <g class="font">
    <g transform="translate(110 32)">
      <rect width="52" height="52" rx="14" fill="#05d66f"/>
      <text x="26" y="34" text-anchor="middle" font-size="20" font-weight="900" fill="#06121f">DE</text>
      <text x="68" y="23" class="white" font-size="28" font-weight="900">Drive</text>
      <text x="139" y="23" class="green" font-size="28" font-weight="900">Ease</text>
      <text x="69" y="43" class="muted" font-size="12" font-weight="700">Travel Partner Workspace</text>
    </g>

    <g transform="translate(820 34)">
      <rect width="234" height="50" rx="15" fill="#2f86ff"/>
      <text x="117" y="32" text-anchor="middle" class="white label">Partner Dashboard</text>
      <rect x="270" width="126" height="50" rx="15" fill="#111d30" stroke="#263a56"/>
      <text x="333" y="32" text-anchor="middle" class="white label">Profile</text>
      <rect x="414" width="126" height="50" rx="15" fill="#111d30" stroke="#ff3c55"/>
      <text x="477" y="32" text-anchor="middle" fill="#ff6575" class="label">Logout</text>
    </g>

    <g transform="translate(112 214)">
